name: Cinema City watcher (intensive - release window)

# Runs at a much tighter interval, but only during a narrow window around
# when Cinema City is believed to release the following week's tickets
# (observed to be roughly Tuesday mornings, ~06:30 local time).
#
# GitHub Actions cron is always in UTC, and Prague switches between
# CET (UTC+1) and CEST (UTC+2) with daylight saving. Rather than
# maintaining two schedules, this window is set wide enough to cover
# both: 04:00-06:59 UTC covers 06:00-08:59 CEST (summer) and
# 05:00-07:59 CET (winter). Adjust if you find the actual release time
# differs.

on:
  schedule:
    # Every 2 minutes, hours 4-6 UTC, Tuesdays only.
    - cron: "*/2 4-6 * * 2"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Report all current matching screenings, ignoring saved state"
        type: boolean
        default: false
      test_webhook:
        description: "Just send a test notification to ntfy and exit"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      # Prevents overlapping runs from racing on the git push at the end -
      # important at this polling frequency.
      group: cc-watcher-state
      cancel-in-progress: false
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher (test notification)
        if: ${{ inputs.test_webhook == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watcher.py --test-webhook

      - name: Run watcher (force report)
        if: ${{ inputs.test_webhook != true && inputs.force_report == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watcher.py --force-report

      - name: Run watcher (normal)
        if: ${{ inputs.test_webhook != true && inputs.force_report != true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watcher.py

      - name: Commit updated state
        run: |
          git config user.name "cc-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update state (intensive) [skip ci]"
          git pull --rebase
          git push
